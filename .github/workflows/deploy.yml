name: Deploy Pastor to cPanel Shared Hosting

on:
  push:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      sync_node_modules:
        description: 'Upload full node_modules (needed on first run or when adding new npm dependencies)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Check what files are already sent to FTP without uploading (diff-only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-pastor-cpanel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & Package Pastor for CloudLinux
        env:
          NEXT_PUBLIC_APP_URL: "https://pastor.senaycreatives.com"
          BETTER_AUTH_URL: "https://pastor.senaycreatives.com"
        run: pnpm pack:cpanel

      - name: Deploy Staged Files via FTP / FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          timeout: 180000
          local-dir: ./dist-cpanel/pastor/
          server-dir: ${{ secrets.FTP_PASTOR_DIR || secrets.FTP_SERVER_DIR || 'api/pastor/' }}
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.env
            **/.git/**
            **/.htaccess
            **/.well-known/**
            **/uploads/**
            **/logs/**
            **/*.map
            **/*.md
            ${{ (inputs.sync_node_modules == true || inputs.sync_node_modules == 'true') && '# allow node_modules' || 'app/node_modules/**' }}
